name: External engineering preflight

on:
  push:
    branches: [automation/external-engineering]
    paths: ['automation/**', '.github/workflows/engineering-preflight.yml']
  workflow_dispatch:

# Preparation-only workflow. It cannot write code, release, deploy, or send mail.
permissions:
  contents: read

concurrency:
  group: shelter-prep-engineering-preflight
  cancel-in-progress: false

jobs:
  credential-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: engineering-builder
            secret_name: OPENAI_API_KEY
          - environment: engineering-staging-deploy
            secret_name: RAILWAY_STAGING_TOKEN
          - environment: engineering-qa
            secret_name: SUPABASE_DEV_SECRET_KEY
    environment: ${{ matrix.environment }}
    steps:
      # No checkout and no candidate code in this credential-bearing step.
      # Only availability booleans are retained; no secret values are logged.
      - name: Check existing engineering credential bindings
        env:
          CREDENTIAL: ${{ secrets[matrix.secret_name] }}
          SECRET_NAME: ${{ matrix.secret_name }}
          ENGINEERING_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {'scope': 'binding_presence_only', 'credential_values_recorded': False,
                      'environment': os.environ['ENGINEERING_ENVIRONMENT'],
                      'bindings': {os.environ['SECRET_NAME']: bool(os.environ.get('CREDENTIAL'))}}
          Path('engineering-evidence').mkdir(exist_ok=True)
          Path('engineering-evidence/credential-readiness.json').write_text(json.dumps(evidence))
          print(json.dumps(evidence))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-credential-readiness-${{ matrix.environment }}-${{ github.run_id }}
          path: engineering-evidence/credential-readiness.json
          retention-days: 7
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            automation
          sparse-checkout-cone-mode: false
      - name: Verify orchestration and fail-closed checks
        run: python3 -m unittest discover -s automation -p 'test_*.py' -v
      - name: Record read-only staging prerequisites
        env:
          STAGING_URL: https://shelter-prep-phase1-staging-production.up.railway.app
          APPROVED_STAGING_URL: https://shelter-prep-phase1-staging-production.up.railway.app
        run: python3 automation/preflight.py
      - name: Preserve evidence even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: engineering-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
